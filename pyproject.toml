[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archaeocode"
version = "0.3.0"
description = "Automated software archaeology: excavate user stories, dependency maps, and structure from legacy code with LangGraph + MCP agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oliver Sick" }]
keywords = ["reverse-engineering", "legacy-code", "langgraph", "mcp", "tree-sitter", "cobol", "smalltalk", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
]
dynamic = ["dependencies"]

[project.scripts]
archaeo = "src.orchestration.cli:main"

[project.urls]
Homepage = "https://github.com/osick/archaeocode"
Issues = "https://github.com/osick/archaeocode/issues"

[tool.setuptools]
packages = { find = { include = ["src", "src.*"] } }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
